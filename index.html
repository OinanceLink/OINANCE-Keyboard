<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>OINANCE Keyboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="keyboard-app">

    <!-- =========================
         OINANCE HEADER
    ========================== -->

    <header class="keyboard-header">

      <div class="oinance-logo">
        ◎
      </div>

      <div>
        <h1>OINANCE</h1>
        <p>KEYBOARD</p>
      </div>

    </header>


    <!-- =========================
         TYPING AREA
    ========================== -->

    <div class="typing-area">

      <div id="typedText">
        Start typing...
      </div>

    </div>


    <!-- =========================
         OINANCE FEATURE TOOLBAR
    ========================== -->

    <div class="feature-toolbar">

      <button
        class="feature-button"
        id="aiButton"
      >
        🤖
        <span>AI</span>
      </button>


      <button
        class="feature-button"
        id="translateButton"
      >
        🌍
        <span>Translate</span>
      </button>


      <button
        class="feature-button"
        id="suggestButton"
      >
        💡
        <span>Suggest</span>
      </button>


      <button
        class="feature-button"
        id="calculatorButton"
      >
        🔢
        <span>Calc</span>
      </button>


      <button
        class="feature-button"
        id="currencyButton"
      >
        💰
        <span>Money</span>
      </button>


      <button
        class="feature-button"
        id="marketButton"
      >
        ₿
        <span>Markets</span>
      </button>


      <button
        class="feature-button"
        id="clipboardButton"
      >
        📋
        <span>Paste</span>
      </button>


      <button
        class="feature-button"
        id="voiceButton"
      >
        🎙️
        <span>Voice</span>
      </button>

    </div>


    <!-- =========================
         KEYBOARD
    ========================== -->

    <main class="keyboard">


      <!-- =========================
           LETTER KEYBOARD
      ========================== -->

      <div id="letterKeyboard">

        <!-- Row 1 -->

        <div class="key-row">

          <button class="key">Q</button>
          <button class="key">W</button>
          <button class="key">E</button>
          <button class="key">R</button>
          <button class="key">T</button>
          <button class="key">Y</button>
          <button class="key">U</button>
          <button class="key">I</button>
          <button class="key">O</button>
          <button class="key">P</button>

        </div>


        <!-- Row 2 -->

        <div class="key-row">

          <button class="key">A</button>
          <button class="key">S</button>
          <button class="key">D</button>
          <button class="key">F</button>
          <button class="key">G</button>
          <button class="key">H</button>
          <button class="key">J</button>
          <button class="key">K</button>
          <button class="key">L</button>

        </div>


        <!-- Row 3 -->

        <div class="key-row">

          <button class="key special">
            ⇧
          </button>

          <button class="key">Z</button>
          <button class="key">X</button>
          <button class="key">C</button>
          <button class="key">V</button>
          <button class="key">B</button>
          <button class="key">N</button>
          <button class="key">M</button>

          <button class="key special">
            ⌫
          </button>

        </div>

      </div>


      <!-- =========================
           NUMBER KEYBOARD
      ========================== -->

      <div
        id="numberKeyboard"
        style="display: none;"
      >

        <!-- Numbers -->

        <div class="key-row">

          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key">0</button>

        </div>


        <!-- Symbols -->

        <div class="key-row">

          <button class="key">@</button>
          <button class="key">#</button>
          <button class="key">$</button>
          <button class="key">%</button>
          <button class="key">&amp;</button>
          <button class="key">*</button>
          <button class="key">-</button>
          <button class="key">+</button>
          <button class="key">=</button>

        </div>


        <!-- More symbols -->

        <div class="key-row">

          <button class="key">!</button>
          <button class="key">?</button>
          <button class="key">(</button>
          <button class="key">)</button>
          <button class="key">/</button>
          <button class="key">:</button>
          <button class="key">;</button>
          <button class="key">"</button>

          <button class="key special">
            ⌫
          </button>

        </div>

      </div>


      <!-- =========================
           BOTTOM CONTROLS
      ========================== -->

      <div class="key-row bottom-row">

        <button
          id="numberButton"
          class="key special"
        >
          123
        </button>


        <button
          id="letterButton"
          class="key special"
          style="display: none;"
        >
          ABC
        </button>


        <button class="key special">
          🌐
        </button>


        <button class="key space-key">
          SPACE
        </button>


        <button class="key special">
          ↵
        </button>

      </div>

    </main>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>

</html>
