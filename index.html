<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">
  <meta name="description" content="OINANCE Keyboard — a smart keyboard prototype.">

  <title>OINANCE Keyboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="keyboard-app">

    <!-- TEXT PREVIEW -->
    <section class="typing-section">
      <div class="typing-top">
        <span class="typing-label">OINANCE KEYBOARD</span>
        <button id="clearButton" class="clear-button">Clear</button>
      </div>

      <div id="typedText" class="typed-text">Start typing...</div>
    </section>

    <!-- WORD SUGGESTIONS -->
    <div class="suggestion-bar">
      <button class="suggestion">Hello</button>
      <button class="suggestion">Thanks</button>
      <button class="suggestion">Good</button>
      <button class="suggestion">👍</button>
    </div>

    <!-- EXTRA TOOLS: OPEN WITH A LONG PRESS ON SPACE -->
    <div id="featureToolbar" class="feature-toolbar hidden">

      <button class="tool-button" data-panel="aiPanel">
        <span>✦</span>
        <small>AI Writing</small>
      </button>

      <button class="tool-button" data-panel="translatePanel">
        <span>文</span>
        <small>Translate</small>
      </button>

      <button class="tool-button" data-panel="calculatorPanel">
        <span>＋</span>
        <small>Calculator</small>
      </button>

      <button class="tool-button" data-panel="moneyPanel">
        <span>₦</span>
        <small>Money</small>
      </button>

      <button class="tool-button" data-panel="clipboardPanel">
        <span>▣</span>
        <small>Clipboard</small>
      </button>

    </div>

    <!-- FEATURE PANELS -->
    <section id="featurePanel" class="feature-panel">

      <!-- AI WRITING -->
      <div id="aiPanel" class="panel-content">
        <div class="panel-title">AI Writing Assistant ✦</div>

        <div class="ai-actions">
          <button data-ai="Rewrite">Rewrite</button>
          <button data-ai="Grammar">Fix grammar</button>
          <button data-ai="Shorten">Summarize</button>
          <button data-ai="Professional">Professional tone</button>
        </div>
      </div>

      <!-- TRANSLATION -->
      <div id="translatePanel" class="panel-content">
        <div class="panel-title">Translation</div>

        <div class="translation-row">
          <select id="languageSelect">
            <option value="English">English</option>
            <option value="French">French</option>
            <option value="Spanish">Spanish</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Igbo">Igbo</option>
            <option value="Yoruba">Yoruba</option>
          </select>

          <button id="translateAction">Translate</button>
        </div>
      </div>

      <!-- INDIVIDUAL EMOJIS -->
      <div id="emojiPanel" class="panel-content">
        <div class="panel-title">OINANCE Emojis 🖤</div>

        <p class="emoji-description">
          Choose an emoji to add it to your text.
        </p>

        <div class="emoji-tabs">
          <button class="emoji-tab active" data-emoji-category="smileys">😀</button>
          <button class="emoji-tab" data-emoji-category="hearts">❤️</button>
          <button class="emoji-tab" data-emoji-category="hands">🙏</button>
          <button class="emoji-tab" data-emoji-category="animals">🐈‍⬛</button>
          <button class="emoji-tab" data-emoji-category="symbols">🔥</button>
        </div>

        <div id="standardEmojiGrid" class="standard-emoji-grid"></div>
      </div>

      <!-- CALCULATOR -->
      <div id="calculatorPanel" class="panel-content">
        <div class="panel-title">Calculator</div>

        <div id="calculatorDisplay" class="calculator-display">0</div>

        <div class="calculator-grid">
          <button data-calc="7">7</button>
          <button data-calc="8">8</button>
          <button data-calc="9">9</button>
          <button data-calc="/">÷</button>

          <button data-calc="4">4</button>
          <button data-calc="5">5</button>
          <button data-calc="6">6</button>
          <button data-calc="*">×</button>

          <button data-calc="1">1</button>
          <button data-calc="2">2</button>
          <button data-calc="3">3</button>
          <button data-calc="-">−</button>

          <button data-calc="0">0</button>
          <button data-calc=".">.</button>
          <button id="calculatorClear">C</button>
          <button data-calc="+">+</button>

          <button id="calculatorBackspace">⌫</button>
          <button id="calculatorEquals" class="equals">=</button>
        </div>
      </div>

      <!-- MONEY TOOLS -->
      <div id="moneyPanel" class="panel-content">
        <div class="panel-title">Money Tools</div>

        <div class="money-grid">
          <button>₦ / USD</button>
          <button>USD / ₦</button>
          <button>₦ / GBP</button>
          <button>Crypto & Stocks</button>
        </div>

        <p class="panel-note">
          Currency conversion and market information will be connected in a future version.
        </p>
      </div>

      <!-- CLIPBOARD -->
      <div id="clipboardPanel" class="panel-content">
        <div class="panel-title">Clipboard</div>

        <div id="clipboardItems" class="clipboard-items">
          Your saved text will appear here.
        </div>
      </div>

    </section>

    <!-- MAIN KEYBOARD -->
    <main class="keyboard">

      <!-- LETTERS -->
      <div id="letterKeyboard">

        <div class="key-row">
          <button class="key letter">Q</button>
          <button class="key letter">W</button>
          <button class="key letter">E</button>
          <button class="key letter">R</button>
          <button class="key letter">T</button>
          <button class="key letter">Y</button>
          <button class="key letter">U</button>
          <button class="key letter">I</button>
          <button class="key letter">O</button>
          <button class="key letter">P</button>
        </div>

        <div class="key-row second-row">
          <button class="key letter">A</button>
          <button class="key letter">S</button>
          <button class="key letter">D</button>
          <button class="key letter">F</button>
          <button class="key letter">G</button>
          <button class="key letter">H</button>
          <button class="key letter">J</button>
          <button class="key letter">K</button>
          <button class="key letter">L</button>
        </div>

        <div class="key-row">
          <button id="shiftButton" class="key special-key">⇧</button>

          <button class="key letter">Z</button>
          <button class="key letter">X</button>
          <button class="key letter">C</button>
          <button class="key letter">V</button>
          <button class="key letter">B</button>
          <button class="key letter">N</button>
          <button class="key letter">M</button>

          <button class="key punctuation-key" data-character=".">.</button>
          <button class="key special-key">⌫</button>
        </div>

      </div>

      <!-- NUMBERS AND SYMBOLS -->
      <div id="numberKeyboard" class="hidden">

        <div class="key-row">
          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key">0</button>
        </div>

        <div class="key-row">
          <button class="key">@</button>
          <button class="key">#</button>
          <button class="key">$</button>
          <button class="key">%</button>
          <button class="key">&amp;</button>
          <button class="key">*</button>
          <button class="key">-</button>
          <button class="key">+</button>
          <button class="key">=</button>
        </div>

        <div class="key-row">
          <button class="key">!</button>
          <button class="key">?</button>
          <button class="key">(</button>
          <button class="key">)</button>
          <button class="key">/</button>
          <button class="key">:</button>
          <button class="key">;</button>
          <button class="key special-key">⌫</button>
        </div>

      </div>

      <!-- PERMANENT BOTTOM ROW -->
      <div class="bottom-row">

        <button id="numberButton" class="bottom-key">123</button>
        <button id="letterButton" class="bottom-key hidden">ABC</button>

        <button id="emojiButton" class="bottom-key" aria-label="Open emojis">😊</button>

        <button id="globeButton" class="bottom-key" aria-label="Change language">◎</button>

        <button id="spaceButton" class="space-key">English · Hold for tools</button>

        <button id="voiceButton" class="bottom-key" aria-label="Voice typing">🎙️</button>

        <button id="enterButton" class="bottom-key" aria-label="Enter">↵</button>

      </div>

    </main>

    <footer class="app-footer">
      OINANCE TECHNOLOGY
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
